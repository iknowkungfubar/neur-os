[project]
name = "neur-os"
version = "0.4.0"
description = "NeurOS — ambient wellness operating system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"backend/store/sqlite_store.py" = ["E501"]
"backend/routes/brain.py" = ["E501"]
"backend/routes/export.py" = ["E501"]
"backend/routes/tasks.py" = ["E501"]
"backend/routes/declarative.py" = ["E501"]
"backend/store/base.py" = ["E501"]
"backend/store/memory_store.py" = ["E501", "E741"]
"backend/domain/usecases.py" = ["E501"]
"backend/test_*.py" = ["E501", "E402"]
"backend/routes/admin.py" = ["E722"]
"backend/main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["backend"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.report]
fail_under = 50
show_missing = true
